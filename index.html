<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommunityTree - Arbre Généalogique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --brand-1: #4f46e5;
            --brand-2: #7c3aed;
        }
        * { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

        .gradient-bg { background: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%); }
        .hero-card { transition: transform 0.3s, box-shadow 0.3s; }
        .hero-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -12px rgba(15,23,42,0.18);
        }
        .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(15,23,42,0.12); }

        .hero-pattern {
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.18) 1px, transparent 0);
            background-size: 26px 26px;
        }

        /* Header avec coins arrondis en bas */
        .header-rounded {
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.45);
        }
    </style>
</head>
<body class="bg-slate-50">
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1fWfIgWgv-UagCcp9blTO8iE8AfixVNM",
            authDomain: "mlm1-598b5.firebaseapp.com",
            projectId: "mlm1-598b5",
            storageBucket: "mlm1-598b5.firebasestorage.app",
            messagingSenderId: "601982652419",
            appId: "1:601982652419:web:a34ccee92f95950a63be36",
            measurementId: "G-DLCVD2MRSC"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.settings({ timestampsInSnapshots: true });
    </script>

    <!-- Header avec coins arrondis en bas -->
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-30 border-b border-slate-100 header-rounded">
        <div class="flex items-center justify-between px-4 py-3 max-w-6xl mx-auto">
            <div class="flex items-center">
                <div class="w-9 h-9 rounded-xl gradient-bg flex items-center justify-center mr-2 shadow-md shadow-indigo-200">
                    <i class="fas fa-tree text-white text-sm"></i>
                </div>
                <span class="text-xl font-bold text-slate-800 tracking-tight">CommunityTree</span>
            </div>
            <div class="flex items-center space-x-4 text-sm">
                <span id="totalMembres" class="text-slate-500 font-medium">0 membres</span>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <main class="pt-20 px-4 pb-12 max-w-6xl mx-auto">
        <!-- Section hero avec texte bien visible -->
        <div class="gradient-bg hero-pattern rounded-3xl p-8 md:p-14 text-white text-center mb-12 shadow-xl shadow-indigo-200">
            <div class="w-16 h-16 rounded-2xl bg-white/15 border border-white/30 flex items-center justify-center mx-auto mb-5">
                <i class="fas fa-tree text-2xl text-white/90"></i>
            </div>
            <h1 class="text-3xl md:text-5xl font-bold mb-4 tracking-tight text-white">
                Arbre Généalogique
            </h1>
            <p class="text-base md:text-xl text-white/90 max-w-2xl mx-auto font-medium">
                Suivez l'évolution de votre communauté grâce à notre système d'arbre binaire
            </p>
        </div>

        <!-- Une seule carte : Ma Généalogie -->
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-8 text-center hero-card">
                <div class="w-20 h-20 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-5">
                    <i class="fas fa-sitemap text-indigo-600 text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Ma Généalogie</h2>
                <p class="text-slate-500 text-sm mt-2">Trouvez votre arbre avec votre code ou email</p>
                <a href="genealogie.html" class="mt-6 inline-flex items-center gap-2 px-8 py-3.5 btn-primary font-semibold rounded-xl transition">
                    <i class="fas fa-search"></i>
                    Rechercher
                </a>
            </div>
        </div>

        <!-- Stats rapides -->
        <div class="mt-12 grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 stat-card">
                <p class="text-2xl font-bold text-indigo-600" id="statTotal">0</p>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mt-1">Membres</p>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 stat-card">
                <p class="text-2xl font-bold text-emerald-600" id="statNiveaux">0</p>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mt-1">Niveaux</p>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 stat-card">
                <p class="text-2xl font-bold text-violet-600" id="statFeuilles">0</p>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mt-1">Feuilles</p>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 stat-card">
                <p class="text-lg font-bold text-slate-800 truncate" id="statRacine">-</p>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mt-1">Racine</p>
            </div>
        </div>
    </main>

    <script>
        // ============================================
        // CHARGER LES STATS
        // ============================================

        async function loadStats() {
            try {
                const snapshot = await db.collection('users').get();
                const usersMap = {};
                const membres = [];
                snapshot.forEach(doc => {
                    const data = { id: doc.id, ...doc.data() };
                    usersMap[doc.id] = data;
                    membres.push(data);
                });

                document.getElementById('statTotal').textContent = membres.length;
                document.getElementById('totalMembres').textContent = membres.length + ' membres';

                const racine = membres.find(m => !m.position);
                document.getElementById('statRacine').textContent = racine ?
                    (racine.prenom || '') + ' ' + (racine.nom || '') : '-';

                let niveaux = 0;
                let feuilles = 0;

                if (racine) {
                    const queue = [{ id: racine.id, level: 0 }];
                    const visited = new Set();

                    while (queue.length > 0) {
                        const { id, level } = queue.shift();
                        if (visited.has(id)) continue;
                        visited.add(id);
                        if (level + 1 > niveaux) niveaux = level + 1;

                        const node = usersMap[id];
                        let hasChildren = false;

                        if (node.leftChildId && usersMap[node.leftChildId]) {
                            hasChildren = true;
                            queue.push({ id: node.leftChildId, level: level + 1 });
                        }
                        if (node.rightChildId && usersMap[node.rightChildId]) {
                            hasChildren = true;
                            queue.push({ id: node.rightChildId, level: level + 1 });
                        }

                        if (!hasChildren) feuilles++;
                    }
                }

                document.getElementById('statNiveaux').textContent = niveaux;
                document.getElementById('statFeuilles').textContent = feuilles;

            } catch (error) {
                console.error('Erreur stats:', error);
            }
        }
        loadStats();
    </script>
</body>
</html>
