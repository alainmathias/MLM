<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre Complet - CommunityTree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>

    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .tree-container {
            overflow: auto;
            padding: 20px;
            min-height: 600px;
            background: #f8fafc;
            border-radius: 12px;
            position: relative;
        }
        .tree-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-width: 100%;
            min-height: 100%;
            transition: transform 0.3s;
        }
        .tree-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: default;
            transition: all 0.3s;
        }
        .tree-node:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        .tree-node-content {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px 16px;
            min-width: 120px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
        }
        .tree-node-content.root {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        .tree-node-content .node-name {
            font-weight: 600;
            font-size: 14px;
        }
        .tree-node-content .node-code {
            font-size: 11px;
            color: #6b7280;
        }
        .tree-node-content.root .node-code { color: #e5e7eb; }
        .tree-node-content.suspended {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .tree-children {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            position: relative;
        }
        .tree-children::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            width: 2px;
            height: 10px;
            background: #9CA3AF;
        }
        .tree-child {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .tree-child::before {
            content: '';
            position: absolute;
            top: -10px;
            width: 2px;
            height: 10px;
            background: #9CA3AF;
        }
        .tree-child:first-child::before { left: 50%; }
        .tree-child:last-child::before { right: 50%; }
        .tree-child:only-child::before { left: 50%; }
        .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .zoom-controls {
            position: sticky;
            bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
            max-width: 400px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-info { background: #2563eb; }
        @media (max-width: 768px) {
            .tree-children { gap: 20px; flex-wrap: wrap; }
            .tree-node-content { min-width: 80px; padding: 8px 12px; }
            .tree-node-content .node-name { font-size: 12px; }
            .tree-node-content .node-code { font-size: 10px; }
        }
    </style>
</head>
<body>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1fWfIgWgv-UagCcp9blTO8iE8AfixVNM",
            authDomain: "mlm1-598b5.firebaseapp.com",
            projectId: "mlm1-598b5",
            storageBucket: "mlm1-598b5.firebasestorage.app",
            messagingSenderId: "601982652419",
            appId: "1:601982652419:web:a34ccee92f95950a63be36",
            measurementId: "G-DLCVD2MRSC"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.settings({ timestampsInSnapshots: true });
    </script>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Header -->
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-30">
        <div class="flex items-center justify-between px-4 py-3 max-w-6xl mx-auto">
            <div class="flex items-center">
                <i class="fas fa-tree text-blue-600 text-2xl mr-2"></i>
                <span class="text-xl font-bold text-gray-800">CommunityTree</span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-500" id="totalMembres">0 membres</span>
                <a href="index.html" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="pt-20 px-4 pb-8 max-w-7xl mx-auto">
        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm p-4 stat-card">
                <p class="text-sm text-gray-500">Total</p>
                <p class="text-xl font-bold text-gray-800" id="statTotal">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 stat-card">
                <p class="text-sm text-gray-500">Niveaux</p>
                <p class="text-xl font-bold text-gray-800" id="statNiveaux">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 stat-card">
                <p class="text-sm text-gray-500">Feuilles</p>
                <p class="text-xl font-bold text-gray-800" id="statFeuilles">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 stat-card">
                <p class="text-sm text-gray-500">Racine</p>
                <p class="text-xl font-bold text-gray-800 truncate" id="statRacine">-</p>
            </div>
        </div>

        <!-- Tree -->
        <div class="bg-white rounded-xl shadow-sm p-4">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                <h2 class="text-lg font-bold text-gray-800">
                    <i class="fas fa-sitemap text-blue-600 mr-2"></i> Arbre Complet
                </h2>
                <div class="flex flex-wrap gap-2">
                    <button id="zoomIn" class="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button id="zoomOut" class="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-minus"></i>
                    </button>
                    <button id="resetZoom" class="px-3 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                        <i class="fas fa-home"></i>
                    </button>
                    <button id="refreshTree" class="px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div class="tree-container" id="treeContainer">
                <div class="tree-wrapper" id="treeWrapper">
                    <div id="treeContent" class="flex flex-col items-center">
                        <div class="text-gray-500 text-center py-10">
                            <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
                            <p>Chargement de l'arbre...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Légende -->
        <div class="mt-4 flex flex-wrap gap-4 justify-center text-sm text-gray-600">
            <div class="flex items-center">
                <span class="w-4 h-4 bg-blue-600 rounded-full mr-2"></span>
                Racine
            </div>
            <div class="flex items-center">
                <span class="w-4 h-4 bg-white border-2 border-gray-300 rounded-full mr-2"></span>
                Membre actif
            </div>
            <div class="flex items-center">
                <span class="w-4 h-4 bg-red-100 border-2 border-red-400 rounded-full mr-2"></span>
                Membre suspendu
            </div>
            <div class="flex items-center">
                <span class="w-4 h-4 bg-gray-200 border-2 border-gray-300 rounded-full mr-2"></span>
                Position libre
            </div>
        </div>
    </main>

    <script>
        // ============================================
        // TOAST
        // ============================================

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast toast-info show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ============================================
        // VARIABLES
        // ============================================

        let usersMap = {};
        let scale = 1;
        const MIN_SCALE = 0.3;
        const MAX_SCALE = 2;

        // ============================================
        // ZOOM
        // ============================================

        document.getElementById('zoomIn').addEventListener('click', function() {
            scale = Math.min(scale + 0.1, MAX_SCALE);
            updateZoom();
        });
        document.getElementById('zoomOut').addEventListener('click', function() {
            scale = Math.max(scale - 0.1, MIN_SCALE);
            updateZoom();
        });
        document.getElementById('resetZoom').addEventListener('click', function() {
            scale = 1;
            updateZoom();
        });

        function updateZoom() {
            document.getElementById('treeWrapper').style.transform = `scale(${scale})`;
            document.getElementById('treeWrapper').style.transformOrigin = 'center top';
        }

        // ============================================
        // CONSTRUCTION DE L'ARBRE
        // ============================================

        function buildTreeHTML(nodeId, isRoot = false) {
            const node = usersMap[nodeId];
            if (!node) return null;

            let nodeClass = 'tree-node-content';
            if (isRoot) nodeClass += ' root';
            if (node.statut === 'suspendu') nodeClass += ' suspended';

            const positionLabel = node.position === 'left' ? '⬅' : node.position === 'right' ? '➡' : '';
            
            let html = `
                <div class="tree-node">
                    <div class="${nodeClass}">
                        <div class="node-name">${node.prenom || '?'} ${node.nom || '?'}</div>
                        <div class="node-code">${node.codeMembre || '---'}</div>
                        ${positionLabel ? `<div style="font-size:10px;color:${isRoot ? '#e5e7eb' : '#9ca3af'}">${positionLabel}</div>` : ''}
                        ${node.statut === 'suspendu' ? `<div style="font-size:9px;color:#dc2626;">⛔ Suspendu</div>` : ''}
                    </div>
            `;

            const hasLeft = node.leftChildId && usersMap[node.leftChildId];
            const hasRight = node.rightChildId && usersMap[node.rightChildId];

            if (hasLeft || hasRight) {
                html += `<div class="tree-children">`;
                
                if (hasLeft) {
                    html += `<div class="tree-child">${buildTreeHTML(node.leftChildId)}</div>`;
                } else {
                    html += `<div class="tree-child"><div class="tree-node-content" style="opacity:0.3;border-style:dashed;"><div class="node-name" style="color:#9ca3af;">Libre</div></div></div>`;
                }
                
                if (hasRight) {
                    html += `<div class="tree-child">${buildTreeHTML(node.rightChildId)}</div>`;
                } else {
                    html += `<div class="tree-child"><div class="tree-node-content" style="opacity:0.3;border-style:dashed;"><div class="node-name" style="color:#9ca3af;">Libre</div></div></div>`;
                }
                
                html += `</div>`;
            }

            html += `</div>`;
            return html;
        }

        // ============================================
        // STATISTIQUES
        // ============================================

        function calculateStats() {
            const total = Object.keys(usersMap).length;
            
            let rootId = null;
            for (const [id, data] of Object.entries(usersMap)) {
                if (!data.position) { rootId = id; break; }
            }
            
            let levels = {};
            let feuilles = 0;
            
            if (rootId) {
                const queue = [{ id: rootId, level: 0 }];
                const visited = new Set();
                
                while (queue.length > 0) {
                    const { id, level } = queue.shift();
                    if (visited.has(id)) continue;
                    visited.add(id);
                    
                    if (!levels[level]) levels[level] = 0;
                    levels[level]++;
                    
                    const node = usersMap[id];
                    let hasChildren = false;
                    
                    if (node.leftChildId && usersMap[node.leftChildId]) {
                        hasChildren = true;
                        queue.push({ id: node.leftChildId, level: level + 1 });
                    }
                    if (node.rightChildId && usersMap[node.rightChildId]) {
                        hasChildren = true;
                        queue.push({ id: node.rightChildId, level: level + 1 });
                    }
                    
                    if (!hasChildren) feuilles++;
                }
            }
            
            const niveaux = Object.keys(levels).length;
            const racineNom = rootId && usersMap[rootId] ? 
                `${usersMap[rootId].prenom} ${usersMap[rootId].nom}` : '-';
            
            return { total, niveaux, feuilles, racineNom };
        }

        // ============================================
        // CHARGEMENT
        // ============================================

        async function loadTree() {
            try {
                const snapshot = await db.collection('users').get();
                usersMap = {};
                snapshot.forEach(doc => {
                    usersMap[doc.id] = doc.data();
                });

                const stats = calculateStats();
                document.getElementById('statTotal').textContent = stats.total;
                document.getElementById('statNiveaux').textContent = stats.niveaux;
                document.getElementById('statFeuilles').textContent = stats.feuilles;
                document.getElementById('statRacine').textContent = stats.racineNom;
                document.getElementById('totalMembres').textContent = stats.total + ' membres';

                let rootId = null;
                for (const [id, data] of Object.entries(usersMap)) {
                    if (!data.position) { rootId = id; break; }
                }

                const container = document.getElementById('treeContent');
                if (rootId && usersMap[rootId]) {
                    container.innerHTML = buildTreeHTML(rootId, true);
                } else {
                    container.innerHTML = `
                        <div class="text-gray-500 text-center py-10">
                            <i class="fas fa-tree text-4xl mb-2"></i>
                            <p>Aucun arbre disponible</p>
                            <p class="text-sm mt-2">Ajoutez votre premier membre depuis l'admin</p>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Erreur chargement:', error);
                document.getElementById('treeContent').innerHTML = `
                    <div class="text-red-500 text-center py-10">
                        <i class="fas fa-exclamation-circle text-3xl mb-2"></i>
                        <p>Erreur lors du chargement</p>
                        <button onclick="loadTree()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg">
                            Réessayer
                        </button>
                    </div>
                `;
            }
        }

        // ============================================
        // RAFRAÎCHISSEMENT
        // ============================================

        document.getElementById('refreshTree').addEventListener('click', function() {
            showToast('🔄 Rafraîchissement...');
            loadTree();
        });

        // ============================================
        // INITIALISATION
        // ============================================

        document.addEventListener('DOMContentLoaded', loadTree);
    </script>
</body>
</html>
