<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - CommunityTree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .input-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <script>
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_AUTH_DOMAIN",
            projectId: "VOTRE_PROJECT_ID",
            storageBucket: "VOTRE_STORAGE_BUCKET",
            messagingSenderId: "VOTRE_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
    </script>

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl">
            <div class="text-center">
                <a href="index.html" class="inline-flex items-center justify-center">
                    <i class="fas fa-tree text-blue-600 text-3xl mr-2"></i>
                    <span class="text-2xl font-bold text-gray-800">CommunityTree</span>
                </a>
                <h2 class="mt-6 text-3xl font-bold text-gray-900">Mot de passe oublié</h2>
                <p class="mt-2 text-sm text-gray-600">
                    Entrez votre email pour recevoir un lien de réinitialisation
                </p>
            </div>

            <form id="resetForm" class="mt-8 space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" name="email" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                </div>

                <div id="message" class="hidden px-4 py-3 rounded-lg text-sm"></div>

                <button type="submit" id="submitBtn"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition transform hover:scale-[1.02]">
                    <i class="fas fa-spinner fa-spin hidden mr-2" id="loadingSpinner"></i>
                    <span id="btnText">Envoyer le lien</span>
                </button>
            </form>

            <p class="mt-4 text-center text-sm text-gray-600">
                <a href="connexion.html" class="font-medium text-blue-600 hover:text-blue-500">
                    <i class="fas fa-arrow-left mr-1"></i> Retour à la connexion
                </a>
            </p>
        </div>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const btnText = document.getElementById('btnText');

        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.classList.remove('hidden', 'bg-green-50', 'border-green-200', 'text-green-700', 'bg-red-50', 'border-red-200', 'text-red-700');
            if (type === 'success') {
                messageDiv.classList.add('bg-green-50', 'border', 'border-green-200', 'text-green-700');
            } else {
                messageDiv.classList.add('bg-red-50', 'border', 'border-red-200', 'text-red-700');
            }
        }

        function setLoading(loading) {
            if (loading) {
                loadingSpinner.classList.remove('hidden');
                btnText.textContent = 'Envoi en cours...';
                submitBtn.disabled = true;
            } else {
                loadingSpinner.classList.add('hidden');
                btnText.textContent = 'Envoyer le lien';
                submitBtn.disabled = false;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showMessage('Veuillez entrer votre email', 'error');
                return;
            }

            setLoading(true);
            messageDiv.classList.add('hidden');

            try {
                await auth.sendPasswordResetEmail(email);
                showMessage('Un lien de réinitialisation a été envoyé à votre email', 'success');
                setLoading(false);
            } catch (error) {
                console.error('Erreur:', error);
                if (error.code === 'auth/user-not-found') {
                    showMessage('Aucun compte trouvé avec cet email', 'error');
                } else if (error.code === 'auth/invalid-email') {
                    showMessage('Email invalide', 'error');
                } else {
                    showMessage('Erreur lors de l\'envoi. Veuillez réessayer.', 'error');
                }
                setLoading(false);
            }
        });

        // Vérifier si l'utilisateur est déjà connecté
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
