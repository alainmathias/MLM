<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - CommunityTree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>

    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .sidebar-link {
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        .sidebar-link.active {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            border-right: 3px solid #667eea;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            margin: 0 auto;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active {
            background: #dcfce7;
            color: #166534;
        }
        .status-suspended {
            background: #fee2e2;
            color: #991b1b;
        }
        .copy-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Configuration Firebase -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1fWfIgWgv-UagCcp9blTO8iE8AfixVNM",
            authDomain: "mlm1-598b5.firebaseapp.com",
            projectId: "mlm1-598b5",
            storageBucket: "mlm1-598b5.firebasestorage.app",
            messagingSenderId: "601982652419",
            appId: "1:601982652419:web:a34ccee92f95950a63be36",
            measurementId: "G-DLCVD2MRSC"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.settings({ timestampsInSnapshots: true });
    </script>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-lg transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-40">
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-center h-16 border-b">
                <i class="fas fa-tree text-blue-600 text-2xl mr-2"></i>
                <span class="text-xl font-bold text-gray-800">CommunityTree</span>
            </div>
            
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="dashboard.html" class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-700">
                    <i class="fas fa-home w-5 h-5 mr-3"></i>
                    Dashboard
                </a>
                <a href="arbre.html" class="sidebar-link flex items-center px-4 py-3 rounded-lg text-gray-700">
                    <i class="fas fa-sitemap w-5 h-5 mr-3"></i>
                    Mon Arbre
                </a>
                <a href="profil.html" class="sidebar-link active flex items-center px-4 py-3 rounded-lg text-gray-700">
                    <i class="fas fa-user w-5 h-5 mr-3"></i>
                    Mon Profil
                </a>
                <a href="#" id="logoutBtn" class="sidebar-link flex items-center px-4 py-3 rounded-lg text-red-600 hover:bg-red-50 mt-8">
                    <i class="fas fa-sign-out-alt w-5 h-5 mr-3"></i>
                    Déconnexion
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="md:ml-64">
        <!-- Top Bar -->
        <header class="bg-white shadow-sm fixed top-0 right-0 left-0 md:left-64 z-30">
            <div class="flex items-center justify-between px-4 py-3">
                <button id="sidebarToggle" class="md:hidden text-gray-600 hover:text-gray-800">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-600" id="userName">Chargement...</span>
                    <div class="w-8 h-8 rounded-full gradient-bg flex items-center justify-center text-white font-semibold text-sm" id="userInitial">
                        U
                    </div>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="pt-20 px-4 pb-8">
            <div class="max-w-3xl mx-auto">
                <div class="bg-white rounded-xl shadow-sm p-8">
                    <!-- Avatar -->
                    <div class="profile-avatar gradient-bg" id="profileAvatar">U</div>
                    <h2 class="text-2xl font-bold text-center mt-4" id="profileName">---</h2>
                    <p class="text-center text-gray-500" id="profileCode">---</p>

                    <div class="mt-8 space-y-2">
                        <div class="info-item">
                            <span class="text-gray-600">Email</span>
                            <span class="font-medium" id="profileEmail">---</span>
                        </div>
                        <div class="info-item">
                            <span class="text-gray-600">Téléphone</span>
                            <span class="font-medium" id="profilePhone">---</span>
                        </div>
                        <div class="info-item">
                            <span class="text-gray-600">Statut</span>
                            <span id="profileStatus" class="status-badge status-active">Actif</span>
                        </div>
                        <div class="info-item">
                            <span class="text-gray-600">Rôle</span>
                            <span class="font-medium" id="profileRole">Membre</span>
                        </div>
                        <div class="info-item">
                            <span class="text-gray-600">Date d'inscription</span>
                            <span class="font-medium" id="profileDate">---</span>
                        </div>
                        <div class="info-item">
                            <span class="text-gray-600">Position dans l'arbre</span>
                            <span class="font-medium" id="profilePosition">---</span>
                        </div>
                        <div class="info-item">
                            <span class="text-gray-600">Code Parrain</span>
                            <span class="font-medium" id="profileParrain">---</span>
                        </div>
                        <div class="info-item">
                            <span class="text-gray-600">Parent</span>
                            <span class="font-medium" id="profileParent">---</span>
                        </div>
                    </div>

                    <div class="mt-8 flex flex-wrap gap-4 justify-center">
                        <button onclick="window.location.href='arbre.html'" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            <i class="fas fa-sitemap mr-2"></i> Voir mon arbre
                        </button>
                        <button onclick="copyCode()" class="px-6 py-2 border border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 transition copy-btn">
                            <i class="fas fa-copy mr-2"></i> Copier mon code
                        </button>
                    </div>
                </div>

                <!-- Admin Actions -->
                <div id="adminActions" class="hidden mt-6 bg-white rounded-xl shadow-sm p-8">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Actions Administrateur</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <button onclick="window.location.href='admin/dashboard.html'" class="px-4 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                            <i class="fas fa-chart-pie mr-2"></i> Dashboard Admin
                        </button>
                        <button onclick="window.location.href='admin/membres.html'" class="px-4 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                            <i class="fas fa-users-cog mr-2"></i> Gérer les membres
                        </button>
                        <button onclick="window.location.href='admin/statistiques.html'" class="px-4 py-3 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition">
                            <i class="fas fa-chart-bar mr-2"></i> Statistiques
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentUserData = null;

        // Sidebar toggle
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        });

        // Déconnexion
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            auth.signOut().then(() => {
                window.location.href = 'connexion.html';
            });
        });

        // Copier le code
        window.copyCode = function() {
            const code = document.getElementById('profileCode').textContent;
            if (code && code !== '---') {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(code).then(() => {
                        const btn = document.querySelector('.border-blue-600');
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '<i class="fas fa-check mr-2"></i> Copié !';
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                        }, 2000);
                    });
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = code;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    alert('Code copié !');
                }
            }
        };

        // Charger le profil
        async function loadProfile(user) {
            try {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    console.error('Document utilisateur non trouvé');
                    window.location.href = 'connexion.html';
                    return;
                }

                currentUserData = userDoc.data();
                const data = currentUserData;

                // Mettre à jour l'interface
                const fullName = `${data.prenom} ${data.nom}`;
                document.getElementById('userName').textContent = fullName;
                document.getElementById('userInitial').textContent = data.prenom.charAt(0).toUpperCase();
                document.getElementById('profileAvatar').textContent = data.prenom.charAt(0).toUpperCase();
                document.getElementById('profileName').textContent = fullName;
                document.getElementById('profileCode').textContent = data.codeMembre;
                document.getElementById('profileEmail').textContent = data.email;
                document.getElementById('profilePhone').textContent = data.telephone || 'Non renseigné';

                // Statut
                const statusEl = document.getElementById('profileStatus');
                if (data.statut === 'actif') {
                    statusEl.className = 'status-badge status-active';
                    statusEl.textContent = 'Actif';
                } else {
                    statusEl.className = 'status-badge status-suspended';
                    statusEl.textContent = 'Suspendu';
                }

                // Rôle
                document.getElementById('profileRole').textContent = data.role === 'admin' ? 'Administrateur' : 'Membre';

                // Date
                if (data.dateInscription) {
                    const date = data.dateInscription.toDate ? data.dateInscription.toDate() : new Date(data.dateInscription);
                    document.getElementById('profileDate').textContent = date.toLocaleDateString('fr-FR', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                }

                // Position
                const positionMap = {
                    'left': 'Gauche',
                    'right': 'Droite',
                    null: 'Racine'
                };
                document.getElementById('profilePosition').textContent = positionMap[data.position] || '---';

                // Parrain
                if (data.codeParrain) {
                    document.getElementById('profileParrain').textContent = data.codeParrain;
                    if (data.parrainId) {
                        try {
                            const parrainDoc = await db.collection('users').doc(data.parrainId).get();
                            if (parrainDoc.exists) {
                                const parrainData = parrainDoc.data();
                                document.getElementById('profileParrain').textContent = 
                                    `${parrainData.prenom} ${parrainData.nom} (${data.codeParrain})`;
                            }
                        } catch (error) {
                            console.error('Erreur chargement parrain:', error);
                        }
                    }
                } else {
                    document.getElementById('profileParrain').textContent = 'Aucun (Racine)';
                }

                // Parent
                if (data.parentId) {
                    try {
                        const parentDoc = await db.collection('users').doc(data.parentId).get();
                        if (parentDoc.exists) {
                            const parentData = parentDoc.data();
                            document.getElementById('profileParent').textContent = 
                                `${parentData.prenom} ${parentData.nom} (${parentData.codeMembre})`;
                        }
                    } catch (error) {
                        console.error('Erreur chargement parent:', error);
                    }
                } else {
                    document.getElementById('profileParent').textContent = 'Aucun (Racine)';
                }

                // Afficher les actions admin
                if (data.role === 'admin') {
                    document.getElementById('adminActions').classList.remove('hidden');
                }

            } catch (error) {
                console.error('Erreur chargement profil:', error);
            }
        }

        // Vérifier l'authentification
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'connexion.html';
                return;
            }
            loadProfile(user);
        });
    </script>
</body>
</html>
