<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - CommunityTree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .input-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .error-shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Configuration Firebase -->
    <script type="importmap">
        {
            "imports": {
                "firebase-app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
                "firebase-auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js",
                "firebase-firestore": "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js",
                "firebase-functions": "https://www.gstatic.com/firebasejs/12.17.1/firebase-functions.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase-app";
        import { getAuth, onAuthStateChanged } from "firebase-auth";
        import { getFirestore } from "firebase-firestore";
        import { getFunctions, httpsCallable } from "firebase-functions";

        const firebaseConfig = {
            apiKey: "AIzaSyA1fWfIgWgv-UagCcp9blTO8iE8AfixVNM",
            authDomain: "mlm1-598b5.firebaseapp.com",
            projectId: "mlm1-598b5",
            storageBucket: "mlm1-598b5.firebasestorage.app",
            messagingSenderId: "601982652419",
            appId: "1:601982652419:web:a34ccee92f95950a63be36",
            measurementId: "G-DLCVD2MRSC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);

        // Exporter pour utilisation dans le script
        window.auth = auth;
        window.db = db;
        window.functions = functions;
        window.httpsCallable = httpsCallable;
    </script>

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl">
            <div class="text-center">
                <a href="index.html" class="inline-flex items-center justify-center">
                    <i class="fas fa-tree text-blue-600 text-3xl mr-2"></i>
                    <span class="text-2xl font-bold text-gray-800">CommunityTree</span>
                </a>
                <h2 class="mt-6 text-3xl font-bold text-gray-900">Créer un compte</h2>
                <p class="mt-2 text-sm text-gray-600">Rejoignez notre communauté</p>
            </div>

            <form id="inscriptionForm" class="mt-8 space-y-6">
                <!-- Nom et Prénom -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="nom" class="block text-sm font-medium text-gray-700">Nom *</label>
                        <input type="text" id="nom" name="nom" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                    </div>
                    <div>
                        <label for="prenom" class="block text-sm font-medium text-gray-700">Prénom *</label>
                        <input type="text" id="prenom" name="prenom" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                    </div>
                </div>

                <!-- Téléphone -->
                <div>
                    <label for="telephone" class="block text-sm font-medium text-gray-700">Téléphone *</label>
                    <input type="tel" id="telephone" name="telephone" required
                           placeholder="06 12 34 56 78"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email *</label>
                    <input type="email" id="email" name="email" required
                           placeholder="exemple@email.com"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                </div>

                <!-- Mot de passe -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe *</label>
                    <input type="password" id="password" name="password" required minlength="8"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                    <div class="mt-2">
                        <div class="password-strength bg-gray-200" id="passwordStrength"></div>
                        <div class="flex justify-between mt-1">
                            <span class="text-xs text-gray-500">Minimum 8 caractères</span>
                            <span class="text-xs text-gray-500" id="passwordHelp">Faible</span>
                        </div>
                    </div>
                </div>

                <!-- Confirmation mot de passe -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirmer le mot de passe *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                </div>

                <!-- Code parrain -->
                <div>
                    <label for="codeParrain" class="block text-sm font-medium text-gray-700">Code du parrain</label>
                    <input type="text" id="codeParrain" name="codeParrain"
                           placeholder="Ex: MB000001"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                    <p class="mt-1 text-xs text-gray-500">
                        <i class="fas fa-info-circle mr-1"></i>
                        Obligatoire sauf pour le premier administrateur
                    </p>
                </div>

                <!-- Messages -->
                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm"></div>
                <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm"></div>

                <!-- Conditions -->
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="conditions" type="checkbox" required
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    </div>
                    <label for="conditions" class="ml-2 text-sm text-gray-600">
                        J'accepte les <a href="#" class="text-blue-600 hover:text-blue-500">conditions d'utilisation</a>
                    </label>
                </div>

                <!-- Bouton d'inscription -->
                <button type="submit" id="submitBtn" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-spinner fa-spin hidden mr-2" id="loadingSpinner"></i>
                    <span id="btnText">S'inscrire</span>
                </button>
            </form>

            <p class="mt-4 text-center text-sm text-gray-600">
                Déjà un compte ? 
                <a href="connexion.html" class="font-medium text-blue-600 hover:text-blue-500">Se connecter</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { getAuth, onAuthStateChanged } from "firebase-auth";
        import { getFunctions, httpsCallable } from "firebase-functions";

        const auth = window.auth;
        const functions = window.functions;
        const httpsCallable = window.httpsCallable;

        const form = document.getElementById('inscriptionForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const btnText = document.getElementById('btnText');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordHelp = document.getElementById('passwordHelp');

        // Fonction pour afficher les erreurs
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            errorDiv.classList.add('error-shake');
            successDiv.classList.add('hidden');
            setTimeout(() => {
                errorDiv.classList.remove('error-shake');
            }, 500);
        }

        // Fonction pour afficher le succès
        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
        }

        // Fonction pour le chargement
        function setLoading(loading) {
            if (loading) {
                loadingSpinner.classList.remove('hidden');
                btnText.textContent = 'Inscription en cours...';
                submitBtn.disabled = true;
            } else {
                loadingSpinner.classList.add('hidden');
                btnText.textContent = "S'inscrire";
                submitBtn.disabled = false;
            }
        }

        // Vérification de la force du mot de passe
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
            return strength;
        }

        // Mettre à jour l'indicateur de force du mot de passe
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strength = checkPasswordStrength(password);
            
            const colors = ['#e5e7eb', '#ef4444', '#f59e0b', '#22c55e', '#22c55e'];
            const labels = ['Faible', 'Faible', 'Moyen', 'Fort', 'Très fort'];
            
            passwordStrength.style.width = `${(strength / 4) * 100}%`;
            passwordStrength.style.backgroundColor = colors[strength] || '#e5e7eb';
            passwordHelp.textContent = labels[strength] || 'Faible';
            passwordHelp.style.color = colors[strength] || '#e5e7eb';
        });

        // Vérifier si les mots de passe correspondent
        confirmPasswordInput.addEventListener('input', function() {
            if (this.value && this.value !== passwordInput.value) {
                this.style.borderColor = '#ef4444';
            } else {
                this.style.borderColor = '#d1d5db';
            }
        });

        // Soumission du formulaire
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Récupérer les valeurs
            const nom = document.getElementById('nom').value.trim();
            const prenom = document.getElementById('prenom').value.trim();
            const telephone = document.getElementById('telephone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const codeParrain = document.getElementById('codeParrain').value.trim();
            const conditions = document.getElementById('conditions').checked;

            // Validation
            if (!nom || !prenom || !telephone || !email || !password || !confirmPassword) {
                showError('Tous les champs sont obligatoires');
                return;
            }

            if (password.length < 8) {
                showError('Le mot de passe doit contenir au moins 8 caractères');
                return;
            }

            if (password !== confirmPassword) {
                showError('Les mots de passe ne correspondent pas');
                return;
            }

            if (!conditions) {
                showError('Vous devez accepter les conditions d\'utilisation');
                return;
            }

            if (!codeParrain) {
                // Vérifier si c'est le premier utilisateur
                try {
                    const { getFirestore, collection, getDocs, limit } = await import("firebase-firestore");
                    const db = window.db;
                    const usersSnapshot = await getDocs(collection(db, 'users'), limit(1));
                    if (!usersSnapshot.empty) {
                        showError('Le code du parrain est obligatoire');
                        return;
                    }
                } catch (error) {
                    console.error('Erreur vérification:', error);
                    showError('Erreur lors de la vérification');
                    return;
                }
            }

            setLoading(true);
            errorDiv.classList.add('hidden');

            try {
                // Appeler la Cloud Function
                const inscrireMembre = httpsCallable(functions, 'inscrireMembre');
                const result = await inscrireMembre({
                    nom,
                    prenom,
                    telephone,
                    email,
                    password,
                    codeParrain: codeParrain || null
                });

                const data = result.data;
                
                if (data.success) {
                    showSuccess('Inscription réussie ! Redirection...');
                    
                    // Rediriger vers le dashboard après 2 secondes
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } else {
                    showError(data.message || 'Erreur lors de l\'inscription');
                    setLoading(false);
                }

            } catch (error) {
                console.error('Erreur détaillée:', error);
                
                // Gérer les erreurs spécifiques
                if (error.code === 'already-exists' || error.message?.includes('already-exists')) {
                    showError('Cet email est déjà utilisé');
                } else if (error.code === 'not-found' || error.message?.includes('not-found')) {
                    showError('Code parrain inexistant');
                } else if (error.code === 'invalid-argument' || error.message?.includes('invalid-argument')) {
                    showError('Données invalides : ' + error.message);
                } else {
                    showError('Une erreur est survenue lors de l\'inscription. Veuillez réessayer.');
                }
                setLoading(false);
            }
        });

        // Vérifier si l'utilisateur est déjà connecté
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
