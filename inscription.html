<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - CommunityTree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>

    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .input-focus:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .error-shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .loading-overlay.active {
            display: flex;
        }
        .info-badge {
            background: #f3f4f6;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="text-center">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
            <p class="text-gray-700">Inscription en cours...</p>
        </div>
    </div>

    <!-- Configuration Firebase -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA1fWfIgWgv-UagCcp9blTO8iE8AfixVNM",
            authDomain: "mlm1-598b5.firebaseapp.com",
            projectId: "mlm1-598b5",
            storageBucket: "mlm1-598b5.firebasestorage.app",
            messagingSenderId: "601982652419",
            appId: "1:601982652419:web:a34ccee92f95950a63be36",
            measurementId: "G-DLCVD2MRSC"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.settings({ timestampsInSnapshots: true });
    </script>

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl">
            <div class="text-center">
                <a href="index.html" class="inline-flex items-center justify-center">
                    <i class="fas fa-tree text-blue-600 text-3xl mr-2"></i>
                    <span class="text-2xl font-bold text-gray-800">CommunityTree</span>
                </a>
                <h2 class="mt-6 text-3xl font-bold text-gray-900">Créer un compte</h2>
                <p class="mt-2 text-sm text-gray-600">Rejoignez notre communauté</p>
            </div>

            <form id="inscriptionForm" class="mt-8 space-y-6">
                <!-- Nom et Prénom -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="nom" class="block text-sm font-medium text-gray-700">Nom *</label>
                        <input type="text" id="nom" name="nom" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                    </div>
                    <div>
                        <label for="prenom" class="block text-sm font-medium text-gray-700">Prénom *</label>
                        <input type="text" id="prenom" name="prenom" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                    </div>
                </div>

                <!-- Téléphone -->
                <div>
                    <label for="telephone" class="block text-sm font-medium text-gray-700">Téléphone *</label>
                    <input type="tel" id="telephone" name="telephone" required
                           placeholder="06 12 34 56 78"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email *</label>
                    <input type="email" id="email" name="email" required
                           placeholder="exemple@email.com"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                </div>

                <!-- Mot de passe -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe *</label>
                    <input type="password" id="password" name="password" required minlength="8"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                    <div class="mt-2">
                        <div class="password-strength bg-gray-200" id="passwordStrength"></div>
                        <div class="flex justify-between mt-1">
                            <span class="text-xs text-gray-500">Minimum 8 caractères</span>
                            <span class="text-xs text-gray-500" id="passwordHelp">Faible</span>
                        </div>
                    </div>
                </div>

                <!-- Confirmation mot de passe -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirmer le mot de passe *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                </div>

                <!-- Code parrain avec indicateur -->
                <div>
                    <label for="codeParrain" class="block text-sm font-medium text-gray-700">Code du parrain</label>
                    <input type="text" id="codeParrain" name="codeParrain"
                           placeholder="Ex: MB000001"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm input-focus focus:outline-none">
                    <div id="parrainInfo" class="mt-2">
                        <div class="info-badge">
                            <i class="fas fa-info-circle text-blue-500 mr-2"></i>
                            <span id="parrainMessage">Laissez vide si vous êtes le premier administrateur</span>
                        </div>
                    </div>
                </div>

                <!-- Messages -->
                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm"></div>
                <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm"></div>

                <!-- Conditions -->
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="conditions" type="checkbox" required
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    </div>
                    <label for="conditions" class="ml-2 text-sm text-gray-600">
                        J'accepte les <a href="#" class="text-blue-600 hover:text-blue-500">conditions d'utilisation</a>
                    </label>
                </div>

                <!-- Bouton d'inscription -->
                <button type="submit" id="submitBtn" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-spinner fa-spin hidden mr-2" id="loadingSpinner"></i>
                    <span id="btnText">S'inscrire</span>
                </button>
            </form>

            <p class="mt-4 text-center text-sm text-gray-600">
                Déjà un compte ? 
                <a href="connexion.html" class="font-medium text-blue-600 hover:text-blue-500">Se connecter</a>
            </p>
        </div>
    </div>

    <script>
        // ============================================
        // FONCTIONS UTILITAIRES
        // ============================================

        // Vérifier si c'est le premier utilisateur
        async function isFirstUser() {
            try {
                const snapshot = await db.collection('users').limit(1).get();
                return snapshot.empty;
            } catch (error) {
                console.error('Erreur vérification premier utilisateur:', error);
                // En cas d'erreur, supposer que c'est le premier utilisateur
                return true;
            }
        }

        // Générer un code membre unique
        async function generateMemberCode() {
            const counterRef = db.collection('counters').doc('memberCode');
            
            try {
                const result = await db.runTransaction(async (transaction) => {
                    const counterDoc = await transaction.get(counterRef);
                    
                    let currentNumber;
                    if (!counterDoc.exists) {
                        currentNumber = 1;
                        transaction.set(counterRef, { currentNumber });
                    } else {
                        currentNumber = counterDoc.data().currentNumber + 1;
                        transaction.update(counterRef, { currentNumber });
                    }
                    
                    return currentNumber;
                });
                
                return `MB${String(result).padStart(6, '0')}`;
            } catch (error) {
                console.error('Erreur génération code:', error);
                throw new Error('Erreur génération code membre');
            }
        }

        // Rechercher la première position disponible (BFS)
        async function findNextAvailablePosition(racineId) {
            if (!racineId) {
                return { parentId: null, position: null };
            }
            
            const queue = [racineId];
            const visited = new Set();
            
            while (queue.length > 0) {
                const currentId = queue.shift();
                if (visited.has(currentId)) continue;
                visited.add(currentId);
                
                try {
                    const currentDoc = await db.collection('users').doc(currentId).get();
                    
                    if (!currentDoc.exists) continue;
                    
                    const currentData = currentDoc.data();
                    
                    // Vérifier gauche
                    if (!currentData.leftChildId) {
                        return { parentId: currentId, position: 'left' };
                    }
                    queue.push(currentData.leftChildId);
                    
                    // Vérifier droite
                    if (!currentData.rightChildId) {
                        return { parentId: currentId, position: 'right' };
                    }
                    queue.push(currentData.rightChildId);
                } catch (error) {
                    console.error('Erreur BFS:', error);
                }
            }
            
            return { parentId: racineId, position: 'left' };
        }

        // Trouver la racine
        async function findRoot() {
            try {
                const racineQuery = await db.collection('users')
                    .where('position', '==', null)
                    .limit(1)
                    .get();
                
                if (!racineQuery.empty) {
                    return racineQuery.docs[0].id;
                }
                
                // Si pas de racine, prendre le premier utilisateur
                const firstUser = await db.collection('users')
                    .orderBy('dateInscription')
                    .limit(1)
                    .get();
                
                if (!firstUser.empty) {
                    return firstUser.docs[0].id;
                }
                
                return null;
            } catch (error) {
                console.error('Erreur recherche racine:', error);
                return null;
            }
        }

        // ============================================
        // FONCTION D'INSCRIPTION PRINCIPALE
        // ============================================

        async function inscrireMembre(data) {
            const { email, password, nom, prenom, telephone, codeParrain } = data;
            
            // Validation
            if (!email || !password || !nom || !prenom || !telephone) {
                throw new Error('Tous les champs sont obligatoires');
            }
            
            // Vérifier si c'est le premier utilisateur
            const firstUser = await isFirstUser();
            console.log('Est-ce le premier utilisateur?', firstUser);
            
            let parrainDoc = null;
            
            // Si ce n'est pas le premier utilisateur, vérifier le code parrain
            if (!firstUser) {
                if (!codeParrain) {
                    throw new Error('Code parrain obligatoire pour les nouveaux membres');
                }
                
                // Rechercher le parrain par code
                const parrainQuery = await db.collection('users')
                    .where('codeMembre', '==', codeParrain)
                    .limit(1)
                    .get();
                
                if (parrainQuery.empty) {
                    throw new Error('Code parrain inexistant');
                }
                
                parrainDoc = parrainQuery.docs[0];
                console.log('Parrain trouvé:', parrainDoc.id);
            } else {
                // Premier utilisateur : pas besoin de code parrain
                console.log('Premier utilisateur - pas de code parrain requis');
            }
            
            // Créer l'utilisateur Firebase Auth
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                console.log('Utilisateur créé:', user.uid);
                
                // Mettre à jour le profil
                await user.updateProfile({
                    displayName: `${prenom} ${nom}`
                });
                
                // Générer le code membre
                const codeMembre = await generateMemberCode();
                console.log('Code membre généré:', codeMembre);
                
                // Déterminer la position dans l'arbre
                let parentId = null;
                let position = null;
                let parrainId = null;
                
                if (!firstUser) {
                    // Trouver la racine
                    const rootId = await findRoot();
                    console.log('Racine trouvée:', rootId);
                    
                    if (rootId) {
                        const positionInfo = await findNextAvailablePosition(rootId);
                        parentId = positionInfo.parentId;
                        position = positionInfo.position;
                        parrainId = parrainDoc.id;
                        console.log('Position trouvée:', position, 'Parent:', parentId);
                    } else {
                        // Cas d'erreur: pas de racine mais pas premier utilisateur
                        console.error('Pas de racine trouvée mais pas premier utilisateur');
                        throw new Error('Erreur de structure de l\'arbre');
                    }
                }
                
                // Créer le document utilisateur
                const userData = {
                    uid: user.uid,
                    codeMembre: codeMembre,
                    nom: nom,
                    prenom: prenom,
                    telephone: telephone,
                    email: email,
                    codeParrain: codeParrain || null,
                    parrainId: parrainId,
                    parentId: parentId,
                    position: position,
                    leftChildId: null,
                    rightChildId: null,
                    dateInscription: firebase.firestore.FieldValue.serverTimestamp(),
                    statut: 'actif',
                    role: firstUser ? 'admin' : 'member',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                console.log('Données utilisateur à sauvegarder:', userData);
                
                // Utiliser une transaction pour tout sauvegarder atomiquement
                await db.runTransaction(async (transaction) => {
                    // Sauvegarder l'utilisateur
                    transaction.set(db.collection('users').doc(user.uid), userData);
                    
                    // Mettre à jour le parent
                    if (parentId) {
                        const parentRef = db.collection('users').doc(parentId);
                        const updateData = {};
                        if (position === 'left') {
                            updateData.leftChildId = user.uid;
                        } else if (position === 'right') {
                            updateData.rightChildId = user.uid;
                        }
                        transaction.update(parentRef, updateData);
                        console.log('Parent mis à jour:', parentId);
                    }
                });
                
                console.log('Transaction réussie !');
                
                return {
                    success: true,
                    uid: user.uid,
                    codeMembre: codeMembre,
                    message: 'Inscription réussie'
                };
                
            } catch (error) {
                console.error('Erreur dans l\'inscription:', error);
                throw error;
            }
        }

        // ============================================
        // GESTION DU FORMULAIRE
        // ============================================

        const form = document.getElementById('inscriptionForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const btnText = document.getElementById('btnText');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordHelp = document.getElementById('passwordHelp');
        const codeParrainInput = document.getElementById('codeParrain');
        const parrainMessage = document.getElementById('parrainMessage');

        // Mettre à jour le message du code parrain en temps réel
        codeParrainInput.addEventListener('input', async function() {
            const value = this.value.trim();
            const messageEl = document.getElementById('parrainMessage');
            
            if (!value) {
                // Vérifier si c'est le premier utilisateur
                try {
                    const firstUser = await isFirstUser();
                    if (firstUser) {
                        messageEl.innerHTML = '<i class="fas fa-star text-yellow-500 mr-2"></i> Vous êtes le premier administrateur ! Laissez vide.';
                        messageEl.parentElement.style.borderColor = '#f59e0b';
                    } else {
                        messageEl.textContent = '⚠️ Code parrain obligatoire pour les nouveaux membres';
                        messageEl.parentElement.style.borderColor = '#ef4444';
                    }
                } catch (error) {
                    messageEl.textContent = 'Vérification en cours...';
                }
            } else {
                // Vérifier si le code existe
                try {
                    const parrainQuery = await db.collection('users')
                        .where('codeMembre', '==', value)
                        .limit(1)
                        .get();
                    
                    if (!parrainQuery.empty) {
                        const parrainData = parrainQuery.docs[0].data();
                        messageEl.innerHTML = `<i class="fas fa-check-circle text-green-500 mr-2"></i> ✅ Parrain: ${parrainData.prenom} ${parrainData.nom}`;
                        messageEl.parentElement.style.borderColor = '#22c55e';
                    } else {
                        messageEl.innerHTML = '<i class="fas fa-times-circle text-red-500 mr-2"></i> ❌ Code parrain inexistant';
                        messageEl.parentElement.style.borderColor = '#ef4444';
                    }
                } catch (error) {
                    messageEl.textContent = 'Erreur de vérification';
                }
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            errorDiv.classList.add('error-shake');
            successDiv.classList.add('hidden');
            setTimeout(() => {
                errorDiv.classList.remove('error-shake');
            }, 500);
        }

        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
        }

        function setLoading(loading) {
            if (loading) {
                loadingOverlay.classList.add('active');
                loadingSpinner.classList.remove('hidden');
                btnText.textContent = 'Inscription en cours...';
                submitBtn.disabled = true;
            } else {
                loadingOverlay.classList.remove('active');
                loadingSpinner.classList.add('hidden');
                btnText.textContent = "S'inscrire";
                submitBtn.disabled = false;
            }
        }

        // Vérification de la force du mot de passe
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
            return strength;
        }

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strength = checkPasswordStrength(password);
            
            const colors = ['#e5e7eb', '#ef4444', '#f59e0b', '#22c55e', '#22c55e'];
            const labels = ['Faible', 'Faible', 'Moyen', 'Fort', 'Très fort'];
            
            passwordStrength.style.width = `${(strength / 4) * 100}%`;
            passwordStrength.style.backgroundColor = colors[strength] || '#e5e7eb';
            passwordHelp.textContent = labels[strength] || 'Faible';
            passwordHelp.style.color = colors[strength] || '#e5e7eb';
        });

        confirmPasswordInput.addEventListener('input', function() {
            if (this.value && this.value !== passwordInput.value) {
                this.style.borderColor = '#ef4444';
            } else {
                this.style.borderColor = '#d1d5db';
            }
        });

        // Soumission du formulaire
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nom = document.getElementById('nom').value.trim();
            const prenom = document.getElementById('prenom').value.trim();
            const telephone = document.getElementById('telephone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const codeParrain = document.getElementById('codeParrain').value.trim();
            const conditions = document.getElementById('conditions').checked;

            // Validation
            if (!nom || !prenom || !telephone || !email || !password || !confirmPassword) {
                showError('Tous les champs sont obligatoires');
                return;
            }

            if (password.length < 8) {
                showError('Le mot de passe doit contenir au moins 8 caractères');
                return;
            }

            if (password !== confirmPassword) {
                showError('Les mots de passe ne correspondent pas');
                return;
            }

            if (!conditions) {
                showError('Vous devez accepter les conditions d\'utilisation');
                return;
            }

            setLoading(true);
            errorDiv.classList.add('hidden');

            try {
                // Vérifier si c'est le premier utilisateur
                const firstUser = await isFirstUser();
                
                // Si ce n'est pas le premier utilisateur, le code parrain est obligatoire
                if (!firstUser && !codeParrain) {
                    showError('Le code du parrain est obligatoire pour les nouveaux membres');
                    setLoading(false);
                    return;
                }

                const result = await inscrireMembre({
                    nom,
                    prenom,
                    telephone,
                    email,
                    password,
                    codeParrain: codeParrain || null
                });

                if (result.success) {
                    showSuccess('✅ Inscription réussie ! Redirection...');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                }

            } catch (error) {
                console.error('Erreur détaillée:', error);
                
                let errorMessage = 'Une erreur est survenue. Veuillez réessayer.';
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Cet email est déjà utilisé';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Mot de passe trop faible';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Email invalide';
                } else if (error.message?.includes('Code parrain inexistant')) {
                    errorMessage = 'Code parrain inexistant';
                } else if (error.message?.includes('Code parrain obligatoire')) {
                    errorMessage = 'Le code du parrain est obligatoire pour les nouveaux membres';
                } else if (error.message) {
                    errorMessage = error.message;
                }
                
                showError('❌ ' + errorMessage);
                setLoading(false);
            }
        });

        // Vérifier si l'utilisateur est déjà connecté
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
